[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openwebui-codex-swarm"
version = "0.2.0"
description = "A token-conscious Open WebUI model swarm orchestrator and dashboard for Codex."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
owui-swarm = "swarm_router.cli:main"

[tool.setuptools.packages.find]
include = ["swarm_router*"]

[tool.setuptools.package-data]
swarm_router = ["benchmarks/*.json"]
