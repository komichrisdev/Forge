[openwebui]
base_url = "http://127.0.0.1:3000"
endpoint = "/api/chat/completions"
health_endpoint = "/health"
models_endpoint = "/api/models"
api_key_env = "OPEN_WEBUI_API_KEY"
timeout_seconds = 240

[swarm]
max_workers = 4
max_parallel_workers = 3
worker_timeout_seconds = 240
judge_timeout_seconds = 240
max_context_chars = 50000
max_worker_output_tokens = 1200
max_judge_output_tokens = 1400
temperature = 0.15
return_char_limit = 6000
run_directory = "~/.local/share/owui-swarm/runs"
catalog_path = "~/.local/share/owui-swarm/catalog.sqlite3"

[probe]
timeout_seconds = 45
max_parallel = 2

[reliability]
enabled = true
recent_attempt_window = 8
timeout_penalty = 0.20
failure_penalty = 0.15
consecutive_failure_penalty = 0.10
latency_weight = 0.10
cooldown_after_consecutive_failures = 3
cooldown_minutes = 60
allow_explicit_override = true

[dashboard]
host = "127.0.0.1"
port = 8787
# Optional. When set, API requests must include the value of this environment
# variable in X-Swarm-Token. Keep the dashboard on 127.0.0.1 and use an SSH
# tunnel unless you deliberately configure authentication and network controls.
auth_token_env = "SWARM_DASHBOARD_TOKEN"
metadata_directory = "~/.local/share/owui-swarm/dashboard"

[personal]
model_id = "swarm-personal"
loopback_host = "127.0.0.1"
port = 8788
auth_token_env = "SWARM_PERSONAL_API_KEY"
task_directory = "~/.local/share/owui-swarm/personal-tasks"
max_messages = 24
max_message_chars = 12000
max_conversation_chars = 48000
max_output_chars = 10000
max_wiki_context_chars = 6000
max_workers = 2
max_parallel_workers = 2
max_retries = 1
task_timeout_seconds = 240
worker_timeout_seconds = 180
max_active_tasks = 2
completed_task_retention = 200
event_history_retention = 100

[scheduler]
poll_interval_seconds = 30
lease_seconds = 60
timezone = "UTC"

[authority]
supervisor_name = "Codex"
worker_trust = "low"
current_data_policy = "Workers must treat current or changing facts as unverified unless supplied by the supervisor."
execution_policy = "Workers propose; the supervisor inspects, applies, tests, and decides."

# These are role defaults only. They can use any chat-capable model exposed by
# Open WebUI, and can be overridden per run in the CLI or dashboard.
[judge]
name = "integrator"
model = "deepseek-ai/deepseek-v4-flash"
system = """
Act as a subordinate integration clerk. Compare candidate responses, reject
unsupported material, reconcile disagreements, and return one compact proposal
for the supervisor. The supervisor's objective and constraints are controlling.
You have no authority to alter requirements or claim final verification. Reject
invented repository details, shared unsupported assumptions, arbitrary thresholds,
broad exception handling, late validation, and unnecessary abstraction. Preserve
material dissent and explain confidence reductions using observable evidence.
"""

[[workers]]
name = "planner"
model = "qwen/qwen3.5-397b-a17b"
modes = ["auto", "code", "spec", "research", "general"]
system = """
Act as a subordinate planning analyst. Decompose the assigned task, identify
constraints and missing evidence, preserve requirements, separate installed state
from proposals, and propose the smallest useful approach. Do not invent architecture,
repository details, components, or arbitrary thresholds.
"""

[[workers]]
name = "implementer"
model = "minimaxai/minimax-m3"
modes = ["auto", "code", "spec", "general"]
system = """
Act as a subordinate implementer. Produce concrete, minimal output suitable for
supervisor review. For code tasks, prefer the smallest proposed diff and tests,
validate before external work, use narrow exception handling, preserve APIs, and
avoid speculative abstractions, invented symbols, and unsupported safety claims.
"""

[[workers]]
name = "critic"
model = "mistralai/mistral-large-3-675b-instruct-2512"
modes = ["auto", "code", "spec", "research", "general"]
system = """
Act as a subordinate adversarial reviewer. Find hidden assumptions, incorrect
reasoning, security issues, regressions, missing acceptance criteria, and likely
hallucinations. Detect fabricated repository details, broad exception handling,
late validation, scope expansion, and unsupported architecture, safety,
performance, or concurrency claims. Report substantive defects concisely.
"""

[[workers]]
name = "verifier"
model = "qwen/qwen3.5-397b-a17b"
modes = ["auto", "code", "research", "general"]
system = """
Act as a subordinate verifier. Check internal consistency and task coverage.
Separate supplied fact, inference, proposal, and unknown requiring Codex inspection.
Check acceptance criteria, supplied context, contradictions, and execution claims;
return a concise verification checklist without claiming execution.
"""
